# Development tasks for the extension. This is tooling for whoever works on
# munch-group.im-pixi-vscode; it has nothing to do with the pixi projects the
# extension goes looking for in a student's workspace.
#
# Mirrors munch-group/status-monitor-vscode so the two extension repositories
# are driven the same way.

[workspace]
authors = ["Kasper Munch <kaspermunch@birc.au.dk>"]
channels = ["conda-forge"]
name = "im-pixi-vscode"
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]

# Node is pinned here rather than taken from whatever the machine happens to
# have, so that `pixi run build` produces the same bundle everywhere. It also
# means the four platforms above are real: the Windows and Linux code paths in
# this extension have never been exercised, and checking them needs the tasks
# to run there.
[dependencies]
nodejs = ">=22"

[tasks.dependencies]
cmd = "npm install && npm install --loglevel error -g @vscode/vsce"

# Bump the version in package.json and package-lock.json. The version is
# <major>.<minor>.<fix>; the flag says which part moves, and --fix is the
# default because it is the common case.
#
#     pixi run bump            0.1.0 -> 0.1.1
#     pixi run bump --minor    0.1.0 -> 0.2.0
#     pixi run bump --major    0.1.0 -> 1.0.0
#
# No depends-on: bumping a version number does not need node_modules or vsce,
# and making it wait on an npm install is a slow way to edit two files.
[tasks.bump]
cmd = "node scripts/bump-version.js"

# Publish the current version to the Marketplace. Bump first — vsce refuses a
# version that has already been published.
[tasks.publish]
cmd = "vsce publish"
depends-on = ["dependencies"]

# --out gives the package a stable name. Without it vsce writes
# im-pixi-vscode-<version>.vsix, and every task downstream has to know the version.
[tasks.build]
cmd = "npm run compile && vsce package --out im-pixi-vscode.vsix"
depends-on = ["dependencies"]

[tasks.install]
cmd = "which code && code --install-extension im-pixi-vscode.vsix --force || echo 'Install from command palette: Extensions: Install from VSIX...';"
depends-on = ["build"]

# What CI runs, so a failure shows up here before it shows up on a pull request.
[tasks.check]
cmd = "npm run format:check && npm run lint && npm run compile-tests"
depends-on = ["dependencies"]

# Opens a pixi project at a path VS Code has never seen, in a throwaway
# profile, with this extension installed. `pixi run smoketest --stalled`
# reproduces the 30-second kernel stall so the repair can be watched working.
# See scripts/vscode_kernel_smoketest.sh.
[tasks.smoketest]
cmd = "scripts/vscode_kernel_smoketest.sh"

# https://marketplace.visualstudio.com/manage/publishers/munch-group
